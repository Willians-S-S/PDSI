<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta - Previsão Peso Ruminantes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">
        <h1>PredPeso</h1>
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html">Entrar</a></li>
        <li><a href="signup.html" class="active">Criar Conta</a></li>
        <li><a href="profile.html">Perfil</a></li>
        <li><a href="about.html">Sobre</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section class="form-section">
      <h2>Criar Conta</h2>
      <form action="/signup" method="post" enctype="multipart/form-data">
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Seu email" required>

        <label for="username">Username:</label>
        <input type="text" id="username" name="username" placeholder="Seu username" required>

        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" placeholder="Seu cpf" required>

        <label for="password">Senha:</label>
        <input type="password" id="password" name="password" placeholder="Crie uma senha" required>

        <label for="fotoperfil">Foto de perfil:</label>
        <input type="file" id="fotoperfil" name="fotoperfil" required>

        <label for="tipo_usuario">Tipo de Usuário:</label>
        <select id="tipo_usuario" name="tipo_usuario">
          <option value="cuidador">Cuidador</option>
          <option value="admin">Administrador</option>
        </select>

        <button type="submit" id="signup-btn" style="display: block; margin-top: 10px;">Criar Conta</button>

      </form>
    </section>
  </main>
  <footer>
    <p>&copy; 2025 Gerenciamento de Peso de Animais. Todos os direitos reservados.</p>
  </footer>
  <script src="js/signup.js"></script>
</body>
</html>
