<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Perfil - Previsão Peso Ruminantes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Estilos para a pré-visualização da imagem e botão de deletar */
    .profile-pic-preview {
      display: block;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      margin: 10px auto;
      border: 3px solid #ddd;
    }
    .delete-btn {
        background-color: #dc3545;
        color: white;
        border: none;
        padding: 12px 20px;
        cursor: pointer;
        border-radius: 5px;
        width: 100%;
        font-size: 16px;
    }
    .delete-btn:hover {
        background-color: #c82333;
    }
  </style>
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">
        <h1>PredPeso</h1>
      </div>
      <!-- Esta lista será manipulada pelo JavaScript -->
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html">Entrar</a></li>
        <li><a href="signup.html">Criar Conta</a></li>
        <li><a href="profile.html" class="active">Perfil</a></li>
        <li><a href="about.html">Sobre</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section class="form-section">
      <h2>Meus Dados</h2>
      <!-- O form não precisa de action/method, o JS cuida disso -->
      <form id="update-form">
        
        <img id="profile-pic" src="https://via.placeholder.com/150" alt="Foto de Perfil Atual" class="profile-pic-preview">

        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome" placeholder="Seu nome completo">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Seu email">

        <label for="username">Username:</label>
        <input type="text" id="username" name="username" placeholder="Seu username">

        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" placeholder="Seu cpf">

        <label for="password">Nova Senha:</label>
        <input type="password" id="password" name="password" placeholder="Deixe em branco para não alterar">

        <label for="fotoperfil">Alterar Foto de perfil:</label>
        <input type="file" id="fotoperfil" name="fotoperfil" accept="image/*">

        <label for="tipo_usuario">Tipo de Usuário:</label>
        <select id="tipo_usuario" name="tipo_usuario" disabled>
          <option value="cuidador">Cuidador</option>
          <option value="admin">Administrador</option>
        </select>
        <small>O tipo de usuário não pode ser alterado.</small>

        <button type="submit" id="update-btn" style="display: block; margin-top: 20px;">Salvar Alterações</button>
        <button type="button" id="excluir-user-btn" class="delete-btn" style="margin-top: 10px;">Excluir Conta</button>
      </form>
    </section>
  </main>
  <footer>
    <p>© 2025 Gerenciamento de Peso de Animais. Todos os direitos reservados.</p>
  </footer>
  <!-- O SCRIPT DEVE FICAR NO FINAL DO BODY -->
  <script src="js/update-profile.js"></script>
</body>
</html>
